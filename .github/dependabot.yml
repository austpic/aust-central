# CI fails on any new high/critical npm advisory (`npm audit --audit-level=high`),
# so dependencies have to move continuously — these PRs are how they do.
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /mobile/aust-central
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directories: [/server, /client]
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
