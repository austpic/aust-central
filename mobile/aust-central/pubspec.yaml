name: aust_track
description: "AUST Central — campus companion app for Ahsanullah University students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Backend ---
  # Firebase has been removed: the AUST Central API server now owns identity
  # and all feature data. See server/README.md.
  dio: ^5.7.0
  # Tokens live in the Keychain / EncryptedSharedPreferences, never in plain
  # SharedPreferences — which is where the old "Remember Me" wrote the raw
  # password.
  flutter_secure_storage: ^9.2.2

  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.10
  provider: ^6.1.2
  image_picker: ^1.0.7
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300